name: Build Windows and Android
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/windows/x64/runner/Release/

  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Fix share_plus AGP 9 Compatibility
        run: |
          SHARE_PLUS_GRADLE=$(find ~/.pub-cache -path "*/share_plus-*/android/build.gradle" | head -n 1)
          if [ -f "$SHARE_PLUS_GRADLE" ]; then
            echo "Fixing $SHARE_PLUS_GRADLE"
            sed -i '/apply plugin:.*kotlin-android/d' "$SHARE_PLUS_GRADLE"
          fi

      - name: Build APK Release
        run: flutter build apk --release --android-skip-build-dependency-validation
        env:
          ORG_GRADLE_PROJECT_android_defaults_buildFeatures_resValues: "true"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
